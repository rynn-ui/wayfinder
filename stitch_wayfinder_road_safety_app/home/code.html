<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wayfinder - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface-variant": "#424752",
                      "surface": "#faf9fc",
                      "primary-container": "#005eb8",
                      "on-secondary": "#ffffff",
                      "outline": "#727783",
                      "primary": "#00478d",
                      "on-error-container": "#93000a",
                      "inverse-on-surface": "#f1f0f3",
                      "on-error": "#ffffff",
                      "surface-container": "#eeedf0",
                      "primary-fixed": "#d6e3ff",
                      "on-surface": "#1a1c1e",
                      "on-background": "#1a1c1e",
                      "on-tertiary-container": "#ffcec8",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#930009",
                      "on-secondary-fixed-variant": "#3c4858",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#a9c7ff",
                      "on-primary-fixed-variant": "#00468c",
                      "error": "#ba1a1a",
                      "secondary": "#535f70",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed": "#101c2b",
                      "on-primary-fixed": "#001b3d",
                      "surface-container-high": "#e8e8eb",
                      "tertiary-fixed-dim": "#ffb4ab",
                      "on-secondary-container": "#596576",
                      "on-tertiary-fixed": "#410002",
                      "surface-container-highest": "#e3e2e5",
                      "on-primary-container": "#c8daff",
                      "tertiary-fixed": "#ffdad5",
                      "secondary-fixed": "#d7e3f8",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed-dim": "#bbc7db",
                      "outline-variant": "#c2c6d4",
                      "primary-fixed-dim": "#a9c7ff",
                      "secondary-container": "#d7e3f8",
                      "surface-container-low": "#f4f3f6",
                      "inverse-surface": "#2f3033",
                      "surface-dim": "#dadadc",
                      "surface-bright": "#faf9fc",
                      "background": "#faf9fc",
                      "surface-variant": "#e3e2e5",
                      "tertiary": "#94000a",
                      "tertiary-container": "#bb1b1b",
                      "surface-tint": "#005db6"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "4px",
                      "margin-mobile": "16px",
                      "stack-lg": "16px",
                      "section-spacing": "24px",
                      "unit": "8px",
                      "gutter": "8px",
                      "margin-tablet": "24px",
                      "stack-md": "8px"
              },
              "fontFamily": {
                      "body-md": [
                              "Roboto Flex"
                      ],
                      "headline-lg": [
                              "Roboto Flex"
                      ],
                      "label-sm": [
                              "Roboto Flex"
                      ],
                      "display-lg": [
                              "Roboto Flex"
                      ],
                      "body-lg": [
                              "Roboto Flex"
                      ],
                      "title-lg": [
                              "Roboto Flex"
                      ],
                      "label-lg": [
                              "Roboto Flex"
                      ],
                      "headline-lg-mobile": [
                              "Roboto Flex"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",

                      ],
                      "headline-lg": [

                      "label-sm": [

                      ],
                      "display-lg": [
                              "57px",

                                      "letterSpacing": "-0.25px",

                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "400"

                      ],
                      "title-lg": [
                              "22px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-lg": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.1px",
                                      "fontWeight": "500"

                                      "lineHeight": "36px",

          },
        }
      </script>
<style>
          .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
          }
          [data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
          }
      </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface flex items-center justify-between px-margin-mobile h-16 w-full fixed top-0 z-50">
<button aria-label="Menu" class="hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="menu">menu</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed-dim flex-1 text-center">Wayfinder</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile mt-16 mb-20 relative overflow-hidden">
<!-- Ambient Background Pulse -->
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<div class="w-96 h-96 bg-primary rounded-full blur-[100px] animate-[pulse_4s_ease-in-out_infinite]"></div>
</div>
<div class="z-10 flex flex-col items-center text-center space-y-section-spacing w-full max-w-md">
<!-- Status Indicator -->
<div class="flex flex-col items-center space-y-stack-md">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center mb-4 relative">
<div class="absolute inset-0 rounded-full border-2 border-primary border-t-transparent animate-spin opacity-50"></div>
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="my_location" data-weight="fill">my_location</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Ready to Monitor</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px]">
                    Device calibrated and GPS signal strong.
                </p>
</div>
<!-- Primary Action -->
<button class="w-full h-16 bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center space-x-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-sm relative overflow-hidden group">
<span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></span>
<span class="material-symbols-outlined z-10" data-icon="play_arrow" data-weight="fill">play_arrow</span>
<span class="z-10">Start Monitoring</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 md:hidden">
<!-- Tab 1: Map -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-full active:scale-90 transition-all duration-100 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="map">map</span>
<span class="font-label-sm text-label-sm mt-1">Map</span>
</button>
<!-- Tab 2: Home (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-all duration-100">
<span class="material-symbols-outlined" data-icon="shield" data-weight="fill">shield</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Tab 3: History -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-full active:scale-90 transition-all duration-100 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="history">history</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</button>
</nav>
</body></html>
