<style>
        body {
            font-family: 'Roboto Flex', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Checkbox Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 32px;
        }
        
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e3e2e5; /* surface-variant */
            transition: .4s;
            border-radius: 34px;
            border: 2px solid #727783; /* outline */
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
            background-color: #727783; /* outline */
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #005eb8; /* primary-container */
            border-color: #005eb8;
        }
        
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #ffffff;
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen antialiased flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface flex items-center justify-between px-margin-mobile h-16 w-full docked full-width top-0 sticky z-10">

<main class="flex-grow pb-24 md:pb-8 pt-section-spacing px-margin-mobile md:px-margin-tablet max-w-3xl mx-auto w-full">
<div class="space-y-stack-md">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-section-spacing">Settings</h2>
<div class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/30">

<div>

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-px bg-outline-variant/20 mx-4"></div>
<!-- GPS Accuracy Settings -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors text-left active:bg-surface-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="location_searching">location_searching</span>
<div>
<div class="font-body-lg text-body-lg text-on-surface">GPS Accuracy Settings</div>
<div class="font-body-md text-body-md text-on-surface-variant">Manage location precision and battery usage</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-px bg-outline-variant/20 mx-4"></div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const htmlClassList = document.documentElement.classList;
            
            // Check for existing preference
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                themeToggle.checked = true;
                htmlClassList.add('dark');
            } else {
                themeToggle.checked = false;
                htmlClassList.remove('dark');
            }

            themeToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    htmlClassList.add('dark');
                    localStorage.theme = 'dark';
                } else {
                    htmlClassList.remove('dark');
                    localStorage.theme = 'light';
                }
            });
        });
    </script>
