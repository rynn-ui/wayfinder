<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Wayfinder - Live Monitoring</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#424752",
                        "surface": "#faf9fc",
                        "primary-container": "#005eb8",
                        "on-secondary": "#ffffff",
                        "outline": "#727783",
                        "primary": "#00478d",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f1f0f3",
                        "on-error": "#ffffff",
                        "surface-container": "#eeedf0",
                        "primary-fixed": "#d6e3ff",
                        "on-surface": "#1a1c1e",
                        "on-background": "#1a1c1e",
                        "on-tertiary-container": "#ffcec8",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#930009",
                        "on-secondary-fixed-variant": "#3c4858",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#a9c7ff",
                        "on-primary-fixed-variant": "#00468c",
                        "error": "#ba1a1a",
                        "secondary": "#535f70",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#101c2b",
                        "on-primary-fixed": "#001b3d",
                        "surface-container-high": "#e8e8eb",
                        "tertiary-fixed-dim": "#ffb4ab",
                        "on-secondary-container": "#596576",
                        "on-tertiary-fixed": "#410002",
                        "surface-container-highest": "#e3e2e5",
                        "on-primary-container": "#c8daff",
                        "tertiary-fixed": "#ffdad5",
                        "secondary-fixed": "#d7e3f8",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#bbc7db",
                        "outline-variant": "#c2c6d4",
                        "primary-fixed-dim": "#a9c7ff",
                        "secondary-container": "#d7e3f8",
                        "surface-container-low": "#f4f3f6",
                        "inverse-surface": "#2f3033",
                        "surface-dim": "#dadadc",
                        "surface-bright": "#faf9fc",
                        "background": "#faf9fc",
                        "surface-variant": "#e3e2e5",
                        "tertiary": "#94000a",
                        "tertiary-container": "#bb1b1b",
                        "surface-tint": "#005db6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "4px",
                        "margin-mobile": "16px",
                        "stack-lg": "16px",
                        "section-spacing": "24px",
                        "unit": "8px",
                        "gutter": "8px",
                        "margin-tablet": "24px",
                        "stack-md": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Roboto Flex"],
                        "headline-lg": ["Roboto Flex"],
                        "label-sm": ["Roboto Flex"],
                        "display-lg": ["Roboto Flex"],
                        "body-lg": ["Roboto Flex"],
                        "title-lg": ["Roboto Flex"],
                        "label-lg": ["Roboto Flex"],
                        "headline-lg-mobile": ["Roboto Flex"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-indicator {
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        .hazard-box {
            border: 2px solid #ba1a1a; /* Error color for hazard */
            background-color: rgba(186, 26, 26, 0.1);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(186, 26, 26, 0); }
            100% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0); }
        }

        .scrim-top {
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }
        .scrim-bottom {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body class="bg-black text-on-surface w-full h-screen overflow-hidden flex flex-col font-body-md relative antialiased selection:bg-primary-container selection:text-on-primary">
<!-- Camera Feed Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center object-cover" data-alt="A first-person view from a dashboard camera inside a vehicle, driving down a modern, slightly wet city street during twilight. The scene is illuminated by the soft glow of streetlights and the headlights of oncoming traffic, creating a cinematic, slightly technical aesthetic suitable for an AI monitoring interface. The colors are muted urban tones with sharp contrasts from the artificial lights." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCP7HQM21UI8Y8buqxURNqAiNJ3XbWn9tMblpOwhC8MUUnP-UGTOrLBQyLXz2vgiVbByEOo3OhCP_AMkrfP5IsVFrnWbbzgpJHcvG5XbjLbShdoDD72S0SOTTHOXVCf7jOoFeq3dxVmlJkySFFPgFm3GjdqpsLW-_KEBzSQlFZ3PisQbNEqWwOZMLpIfwCgPzmdX19mbqx57bHi-45QkP2pGDjHthKZ0Wecq1H8qlICIsPy4upfwou3tw')"></div>
</div>
<!-- Top Scrim & Status -->
<div class="absolute top-0 w-full z-10 scrim-top px-margin-mobile pt-12 pb-6 flex items-center justify-between">
<div class="flex items-center gap-stack-sm bg-surface-container-highest/20 backdrop-blur-md px-4 py-2 rounded-full border border-surface-variant/30">
<div class="w-3 h-3 rounded-full bg-primary-fixed pulse-indicator"></div>
<span class="font-label-lg text-label-lg text-on-primary">Monitoring Active</span>
</div>
<div class="flex items-center gap-stack-lg text-on-primary">
<span class="material-symbols-outlined" data-icon="signal_cellular_4_bar" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined" data-icon="battery_full" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Center Hazard Detection Area -->
<div class="flex-grow flex items-center justify-center z-10 relative pointer-events-none p-margin-mobile">
<!-- Mock Hazard Box -->
<div class="hazard-box w-64 h-64 md:w-96 md:h-96 rounded-lg relative flex flex-col justify-end p-stack-sm border-t-2 border-b-2 border-l-2 border-r-2 shadow-lg">
<div class="absolute top-2 left-2 bg-error text-on-error font-label-lg text-label-lg font-bold px-2 py-1 rounded flex items-center gap-1 shadow-md"><span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">warning</span>Object Detected</div>
<div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-error"></div>
<div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-error"></div>
<div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-error"></div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-error"></div>
<div class="bg-error backdrop-blur-sm text-on-error font-label-sm text-label-sm px-2 py-0.5 rounded self-end mb-1 mr-1 shadow-md">Pothole - 94%</div></div>
</div>
<!-- Bottom Scrim & Controls -->
<div class="absolute bottom-0 w-full z-20 scrim-bottom px-margin-mobile pb-12 pt-24 flex flex-col gap-section-spacing">
<!-- Telemetry Data -->
<div class="flex justify-between items-end">
<div class="flex flex-col text-on-primary">
<span class="font-label-sm text-label-sm text-surface-variant opacity-80 uppercase tracking-wider">Current Speed</span>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-display-lg font-bold">45</span>
<span class="font-title-lg text-title-lg text-surface-variant opacity-80">km/h</span>
</div>
</div>
<div class="flex flex-col items-end text-on-primary">
<span class="font-label-sm text-label-sm text-surface-variant opacity-80 uppercase tracking-wider">Distance</span>
<span class="font-title-lg text-title-lg">12.4 km</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-error text-on-error font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-on-error-container active:scale-95 transition-all shadow-lg">
<span class="material-symbols-outlined" data-icon="stop_circle" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
            Stop Monitoring
        </button>
</div>


</body></html>
